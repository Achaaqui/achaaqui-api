services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
      uv run --no-sync fastapi run src/main.py --host 0.0.0.0 --port 8000"
    ports:
      - "8090:8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true
